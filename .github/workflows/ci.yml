name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/ui/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Gate phase2-export.v1 asa-ableton handoff
        run: python -m unittest tests.test_phase2_export.AsaAbletonHandoffContractTests
      - run: python -m unittest discover -s tests
      - name: Fundamentals gate (synthetic default corpus)
        run: |
          python scripts/build_synthetic_corpus.py --out-dir tests/fixtures/fundamentals_tracks --manifest tests/fixtures/fundamentals_eval_manifest.json --check --audio-only
          python scripts/evaluate_fundamentals.py --fail-on-skip
      - name: Assert no wrong-interpreter pyc files
        run: |
          BAD=$(
            find __pycache__ scripts/__pycache__ -name '*.pyc' 2>/dev/null \
              | grep -v 'cpython-311' || true
          )
          if [ -n "$BAD" ]; then
            echo "ERROR: Found pyc files compiled by the wrong Python interpreter:"
            echo "$BAD"
            exit 1
          fi

  loudness-wasm:
    name: Loudness WASM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/loudness-spectro-wasm
    steps:
      - uses: actions/checkout@v6
      # rustup is preinstalled on ubuntu-latest; add the wasm target only.
      - run: rustup target add wasm32-unknown-unknown
      # Conformance + the existing ebur128 cross-checks + measure-cli compile.
      # Network-free: the official-set path is skipped when ASA_EBU_TESTSET_DIR
      # is unset.
      - run: cargo test
      # Prove wasm32 compat without needing wasm-bindgen-cli.
      - run: cargo build --release -p asa-dsp-wasm --target wasm32-unknown-unknown
