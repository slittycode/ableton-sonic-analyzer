[package]
name = "asa-dsp"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "BS.1770-5 loudness + spectral-reassignment DSP, lifted from openmeters, for ASA."

[lib]
crate-type = ["rlib"]

[dependencies]
# Pure-Rust FFTs; both compile cleanly to wasm32 (scalar fallback, no threads).
rustfft = "6.4"
realfft = "3.5"

# ebur128 is an independent BS.1770 implementation used ONLY as a test oracle
# (mirrors openmeters' own dev-dependency choice). Not a runtime dependency.
# hound is a pure-Rust WAV reader used ONLY by the optional official-EBU-test-set
# path in tests/ebu_conformance.rs; it never enters the wasm runtime graph.
[dev-dependencies]
ebur128 = "0.1.10"
hound = "3"
